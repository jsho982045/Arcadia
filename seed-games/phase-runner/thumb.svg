    <g fill="#fff"><circle cx="270" cy="30" r="1.5"/><circle cx="330" cy="60" r="1.2"/><circle cx="370" cy="24" r="1.6"/><circle cx="300" cy="90" r="1"/><circle cx="350" cy="120" r="1.3"/></g>
    <circle cx="300" cy="150" r="70" fill="url(#glowc)"/>
    <circle cx="300" cy="150" r="46" fill="url(#moon)"/>
    <circle cx="288" cy="140" r="9" fill="#5a78be" opacity="0.3"/><circle cx="314" cy="162" r="12" fill="#5a78be" opacity="0.3"/>
    <path d="M235 215 V160 h20 v-36 h30 v50 h24 v-70 h30 v60 h26 v-30 h35 V215z" fill="#0f0a3a"/>
    <path d="M255 124 h30 M309 104 h30" stroke="#29f0ff" stroke-width="2"/>
    <g fill="#29f0ff" opacity="0.9"><rect x="262" y="134" width="4" height="5"/><rect x="272" y="150" width="4" height="5"/><rect x="318" y="118" width="4" height="5"/><rect x="330" y="138" width="4" height="5"/><rect x="354" y="140" width="4" height="5"/></g>
    <g fill="#ff50c8"><rect x="266" y="164" width="4" height="5"/><rect x="322" y="150" width="4" height="5"/><rect x="346" y="168" width="4" height="5"/></g>
  </g>
  <!-- ground -->
  <rect y="215" width="400" height="185" fill="#120a30"/>
  <polygon points="188,215 212,215 380,400 20,400" fill="url(#road)"/>
  <g stroke="#7a4dff" stroke-width="1.5" opacity="0.6" fill="none">
