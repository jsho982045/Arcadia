<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset="0.6" stop-color="#ff9966"/><stop offset="1" stop-color="#ffe29a"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04021a"/><stop offset="0.6" stop-color="#180b4d"/><stop offset="1" stop-color="#3b23a8"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c4"/><stop offset="0.5" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff4f6d"/></linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a7dcff"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2070"/><stop offset="1" stop-color="#0d0a2e"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#6a70b0"/></linearGradient>
    <linearGradient id="txt1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8d8"/><stop offset="1" stop-color="#ff8a4a"/></linearGradient>
    <linearGradient id="txt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ffff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
    <radialGradient id="glowc"><stop offset="0" stop-color="#29f0ff" stop-opacity="0.9"/><stop offset="1" stop-color="#29f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowo"><stop offset="0" stop-color="#ffb020" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <clipPath id="L"><polygon points="0,0 235,0 165,400 0,400"/></clipPath>
    <clipPath id="R"><polygon points="235,0 400,0 400,400 165,400"/></clipPath>
    <clipPath id="sunclip"><rect x="0" y="0" width="400" height="215"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#050814"/>
  <g clip-path="url(#L)">
    <rect width="400" height="400" fill="url(#day)"/>
    <g clip-path="url(#sunclip)">
      <circle cx="120" cy="170" r="80" fill="url(#sun)"/>
      <rect x="30" y="176" width="200" height="4" fill="#ff9966"/><rect x="30" y="188" width="200" height="6" fill="#ff9966"/><rect x="30" y="201" width="200" height="8" fill="#ffb27a"/>
    </g>
    <path d="M0 215 V170 h24 v-30 h26 v40 h20 v-60 h30 v70 h26 v-24 h30 v50 h40 V215z" fill="#a03a6a"/>
  </g>
  <g clip-path="url(#R)">
