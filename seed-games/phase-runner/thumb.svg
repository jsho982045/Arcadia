    <path d="M200 215 L-60 400 M200 215 L-140 400 M200 215 L460 400 M200 215 L540 400"/>
  </g>
  <path d="M188 215 L20 400" stroke="#ffb020" stroke-width="4"/><path d="M212 215 L380 400" stroke="#29f0ff" stroke-width="4"/>
  <path d="M200 215 L200 400" stroke="#fff" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.6"/>
  <!-- obstacles -->
  <ellipse cx="150" cy="322" rx="46" ry="34" fill="url(#glowo)"/>
  <rect x="122" y="292" width="56" height="52" fill="#ffb020" stroke="#fff2b8" stroke-width="3"/>
  <polygon points="122,292 178,292 172,280 128,280" fill="#ffe27a"/>
  <path d="M122 318 l14 -14 h10 l-14 14z M150 318 l14 -14 h10 l-14 14z" fill="#3c0f14" opacity="0.7"/>
  <ellipse cx="254" cy="276" rx="34" ry="46" fill="url(#glowc)"/>
  <polygon points="236,300 244,272 254,254 264,272 272,300" fill="#7a4dff" stroke="#29f0ff" stroke-width="3"/>
  <path d="M254 254 V300" stroke="#7ffcff" stroke-width="2"/>
  <!-- coins -->
  <g fill="#ffd23a" stroke="#a86a00" stroke-width="2"><ellipse cx="208" cy="248" rx="7" ry="9"/><ellipse cx="205" cy="270" rx="9" ry="11"/></g>
  <!-- ship -->
  <ellipse cx="200" cy="384" rx="46" ry="8" fill="#000" opacity="0.5"/>
  <circle cx="200" cy="376" r="46" fill="url(#glowc)"/>
  <path d="M188 374 L184 392 L192 374z M212 374 L216 392 L208 374z" fill="#29f0ff"/>
  <polygon points="150,376 182,332 200,314 218,332 250,376 226,380 200,370 174,380" fill="#23204a"/>
  <polygon points="155,373 184,335 200,318 216,335 245,373 224,377 200,368 176,377" fill="url(#wing)"/>
  <polygon points="155,373 168,357 182,371 176,377" fill="#ffb020"/><polygon points="245,373 232,357 218,371 224,377" fill="#29f0ff"/>
  <polygon points="193,354 200,330 207,354 200,362" fill="#a855ff"/>
  <ellipse cx="200" cy="346" rx="8" ry="13" fill="#12102e"/><ellipse cx="200" cy="343" rx="5" ry="9" fill="#bff8ff"/>
  <!-- phase split -->
  <path d="M235 0 L165 400" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <!-- title -->
  <g font-family="Arial Black, Impact, system-ui, sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="196" y="66" font-size="58" fill="#ff2878" opacity="0.8">PHASE</text>
    <text x="204" y="66" font-size="58" fill="#14dcff" opacity="0.8">PHASE</text>
    <text x="200" y="66" font-size="58" fill="url(#txt1)">PHASE</text>
    <text x="196" y="118" font-size="50" fill="#ff2878" opacity="0.8">RUNNER</text>
    <text x="204" y="118" font-size="50" fill="#14dcff" opacity="0.8">RUNNER</text>
    <text x="200" y="118" font-size="50" fill="url(#txt2)">RUNNER</text>
  </g>
</svg>
